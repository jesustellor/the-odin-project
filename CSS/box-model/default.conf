    server {
        listen 80;
        server_name localhost;
        # Hide specific Nginx version numbers (e.g. nginx/1.25.4 -> nginx)
        # Resolves: "Server Leaks Version Information"
        server_tokens off;
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;

            # 1. Block frame-embedding to prevent UI Redressing/Clickjacking
            # Resolves: "Missing Anti-clickjacking Header"
            add_header X-Frame-Options "SAMEORIGIN" always;

            # 2. Prevent the browser from trying to sniff content-types
            # Resolves: "X-Content-Type-Options Header Missing"
            add_header X-Content-Type-Options "nosniff" always;
            # 3. Restrict content loading to trusted sources
            # Resolves: "Content Security Policy (CSP) Header Not Set"
            # We allow 'unsafe-inline' for style-src so our inline demo styling works
            add_header Content-Security-Policy "default-src 'self'; style-src 'self'
  'unsafe-inline';" always;
            # 4. Lock down access to hardware & browser APIs
            # Resolves: "Permissions Policy Header Not Set"
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()"
  always;

            # 5. Prevent cross-origin resource leaks
            # Resolves: "Cross-Origin-Embedder-Policy Header Missing"
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
        }
    }
